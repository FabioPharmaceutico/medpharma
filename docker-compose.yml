services:
  db:
    image: postgres:16-alpine
    container_name: medapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medapp
      POSTGRES_PASSWORD: medapp
      POSTGRES_DB: medapp
    ports:
      - "5432:5432"
    volumes:
      - medapp_pgdata:/var/lib/postgresql/data
volumes:
  medapp_pgdata:
